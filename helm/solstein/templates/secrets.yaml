apiVersion: v1
kind: Secret
metadata:
  name: {{ include "solstein.fullname" . }}-secrets
  labels:
    {{- include "solstein.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default (printf "postgresql://postgres:%s@%s-postgresql:5432/solstein" .Values.postgresql.auth.password .Release.Name) | quote }}
  redis-url: {{ .Values.secrets.redisUrl | default (printf "redis://%s-redis-master:6379/0" .Release.Name) | quote }}
  secret-key: {{ .Values.secrets.secretKey | default (randAlphaNum 32) | quote }}
  github-token: {{ .Values.secrets.githubToken | quote }}
  # LLM API Keys
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | quote }}
  fireworks-api-key: {{ .Values.secrets.fireworksApiKey | quote }}
  mistral-api-key: {{ .Values.secrets.mistralApiKey | quote }}
  deepinfra-api-key: {{ .Values.secrets.deepinfraApiKey | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  nvidia-nim-api-key: {{ .Values.secrets.nvidiaNimApiKey | quote }}
  cerebras-api-key: {{ .Values.secrets.cerebrasApiKey | quote }}
  kimi-api-key: {{ .Values.secrets.kimiApiKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  siliconflow-api-key: {{ .Values.secrets.siliconflowApiKey | quote }}
  alibaba-api-key: {{ .Values.secrets.alibabaApiKey | quote }}
  # Data Source API Keys
  exa-api-key: {{ .Values.secrets.exaApiKey | quote }}
  crunchbase-api-key: {{ .Values.secrets.crunchbaseApiKey | quote }}
  news-api-key: {{ .Values.secrets.newsApiKey | quote }}
  patentsview-api-key: {{ .Values.secrets.patentsviewApiKey | quote }}
  companies-house-api-key: {{ .Values.secrets.companiesHouseApiKey | quote }}
  openfigi-api-key: {{ .Values.secrets.openfigiApiKey | quote }}
  opencorporates-api-key: {{ .Values.secrets.opencorporatesApiKey | quote }}
  pitchbook-api-key: {{ .Values.secrets.pitchbookApiKey | quote }}
  orbis-api-key: {{ .Values.secrets.orbisApiKey | quote }}
  capiq-api-key: {{ .Values.secrets.capiqApiKey | quote }}
  google-api-key: {{ .Values.secrets.googleApiKey | quote }}
