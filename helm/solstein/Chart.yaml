apiVersion: v2
name: solstein
description: A Helm chart for Solstein - AI-Powered Competitive Intelligence Platform
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - solstein
  - competitive-intelligence
  - ai
  - fastapi
home: https://solstein.app
sources:
  - https://github.com/your-org/solstein
maintainers:
  - name: Platform Team
    email: platform@solstein.app
dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: ingress-nginx
    version: 4.x.x
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
