[project]
name = "solstein"
version = "0.1.0"
description = "AI-Powered Competitive Intelligence Platform for PE/VC"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AI Whisperers", email = "team@ai-whisperers.com"},
]
license = {text = "Proprietary"}
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "rich>=13.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "click>=8.1",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg[binary]>=3.1",
    "aiosqlite>=0.19",
    "supabase>=2.3",
    "httpx>=0.27",
    "edgartools",
    "lxml>=4.9",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-httpx",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
    "pre-commit>=3.5",
]

[project.scripts]
solstein = "solstein.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "legacy",
    ".antigravity",
]
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "B007",
    "B017",
    "C401",
    "C408",
    "C414",
    "E402",
    "E501",
    "E701",
    "N802",
    "N803",
    "N806",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM118",
    "UP042",
    "W291",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
ignore_missing_imports = true
follow_imports = "silent"
strict = false
files = [
    "src/solstein/application",
    "src/solstein/api/main.py",
    "src/solstein/cli.py",
    "src/solstein/config.py",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "import-untyped",
    "index",
    "list-item",
    "misc",
    "no-redef",
    "operator",
    "return-value",
    "union-attr",
    "var-annotated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --cov=solstein --cov-report=term-missing"
markers = [
    "unit: fast isolated tests",
    "integration: tests involving API/service integration",
    "data_quality: regression tests against curated datasets",
    "agents: tests for agent orchestration behavior",
    "slow: long-running tests",
    "e2e: end-to-end tests",
]
