[project]
name = "solstein"
version = "0.1.0"
description = "AI-Powered Competitive Intelligence Platform for PE/VC"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI Whisperers", email = "team@ai-whisperers.com" },
]
# Updated 2026-03-11: langgraph>=1.0.10, langgraph-checkpoint>=4.0.1
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0,<3.0",
    "openpyxl>=3.1",
    "rich>=13.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "click>=8.1",
    "fastapi>=0.104,<1.0",
    "starlette>=0.37.0,<1.0",  # Pinned: starlette 1.0+ requires fastapi>=0.115.0 which has breaking changes
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0,<3.0",
    "pgvector>=0.4,<1.0",
    "alembic>=1.12",
    "psycopg[binary]>=3.1",
    "aiosqlite>=0.19",
    "supabase>=2.3",
    "httpx>=0.27",
    "edgartools",
    "lxml>=4.9",
    "yfinance>=0.2",
    "langgraph>=1.0.10",  # Fixes CVE-2025-64439, CVE-2026-28277 - requires >=1.0.10 for checkpoint 4.x compatibility
    "langgraph-checkpoint>=4.0.1",  # Fixes CVE-2026-28277 - unsafe msgpack deserialization
    "langchain-core>=0.3.29",  # Fixes path traversal in legacy load()
    "PyJWT>=2.10.0",  # Fixes unknown crit header acceptance
    "asyncpg>=0.31.0",
    "pytest-asyncio>=1.3.0",
    "redis>=5.0",
    "aiohttp>=3.9.0",
    "feedparser>=6.0",  # STORY-254: Required by connectors.news at import time
    "email-validator>=2.0",  # STORY-254: Required by Pydantic email fields in API models
    "fpdf2>=2.7",  # STORY-114: PDF report generation
    "bcrypt>=5.0.0",
    "celery>=5.3.0",
    "anthropic>=0.40.0",  # EPIC-021: Native Anthropic SDK for LLM calls
    "openai>=1.0",  # EPIC-021: OpenAI-compatible SDK for multi-provider support
    "instructor>=1.0",  # STORY-072: Pydantic schema validation for structured LLM outputs
    "langfuse>=2.0",  # STORY-073: LLM observability, cost tracking, prompt management
    "opentelemetry-api>=1.20",  # STORY-050: Distributed tracing
    "opentelemetry-sdk>=1.20",  # STORY-050: OTel SDK
    "opentelemetry-exporter-otlp-proto-http>=1.20",  # STORY-050: OTLP HTTP exporter
    "opentelemetry-instrumentation-fastapi>=0.40b0",  # STORY-050: FastAPI auto-instrumentation
    "prometheus-client>=0.20",  # STORY-051: Prometheus metrics endpoint
]

[project.license]
text = "Proprietary"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-httpx",
    "factory-boy>=3.3",
    "black>=24.4",
    "ruff>=0.1",
    "mypy>=1.6",
    "pre-commit>=3.5",
    "pytest-xdist>=3.3.0",
]

[project.scripts]
solstein = "solstein.cli:main"
solstein-legacy = "solstein.cli_legacy:main"

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "legacy",
    ".antigravity",
]
src = [
    "src",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "TCH",
    "TRY",   # STORY-132: Exception handling lint rules
]
ignore = [
    "B008",
    "B007",
    "B017",
    "B028",   # No explicit stacklevel — pre-existing, low risk
    "B905",   # zip() without strict= — pre-existing, needs audit
    "C401",
    "C408",
    "C414",
    "E402",
    "E501",
    "E701",
    "F403",   # Wildcard imports in connector __init__.py — intentional re-export pattern
    "F405",   # Undefined from wildcard import — consequence of F403 pattern
    "F821",   # Undefined name from TYPE_CHECKING blocks — needs Python 3.12 migration
    "N802",
    "N803",
    "N806",
    "SIM102",
    "SIM103",
    "SIM105", # contextlib.suppress — pre-existing, style preference
    "SIM108",
    "SIM110", # any() replacement — pre-existing, readability preference
    "SIM117", # Nested with statements — pre-existing, needs refactor epic
    "SIM118",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TRY003",  # STORY-132: raise-vanilla-args — 351 pre-existing, gradual cleanup
    "TRY300",  # STORY-132: try-consider-else — 97 pre-existing, style preference
    "TRY301",  # STORY-132: raise-within-try — 18 pre-existing, gradual cleanup
    "TRY004",  # STORY-132: type-check-without-type-error — 8 pre-existing, style preference
    "TRY400",  # STORY-132: error-instead-of-exception — 75 pre-existing, gradual cleanup
    "N818",   # Exception naming with Error suffix — renaming is a breaking change, tracked separately
    "UP017",
    "UP036",
    "UP041",  # Replace aliased errors with TimeoutError — pre-existing, needs audit
    "UP042",
    "UP046",  # Generic subclass pattern — pre-existing, needs py312 migration epic
    "UP047",  # Generic function type params — pre-existing, needs py312 migration epic
    "W291",
    "W293",   # Whitespace in blank lines — auto-fixable but noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "TRY002",  # raise Exception(...) in test stubs/mocks is idiomatic — no need for custom exception classes
]
"src/solstein/connectors/**/__init__.py" = [
    "F401",  # Connector __init__ files are intentional re-export aggregators
]
"tests/factories/__init__.py" = [
    "F401",  # Factory __init__ is a re-export aggregator
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
ignore_missing_imports = true
follow_imports = "silent"
strict = false
files = [
    "src/solstein/application",
    "src/solstein/api/main.py",
    "src/solstein/cli.py",
    "src/solstein/config.py",
    "src/solstein/analytics/classification.py",
    "src/solstein/analytics/company_loader.py",
    "src/solstein/analytics/completeness.py",
    "src/solstein/analytics/confidence_weighting.py",
    "src/solstein/data/interpolation.py",
    "src/solstein/data/unified_loader.py",
    "src/solstein/presentation",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "import-untyped",
    "index",
    "list-item",
    "misc",
    "no-redef",
    "operator",
    "return-value",
    "union-attr",
    "var-annotated",
    "valid-type",
    "dict-item",
    "type-var",
]
namespace_packages = true
exclude = [
    "^\\.venv",
    "^build",
    "^dist",
    "^tests",
    "^site-packages",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    ".",
]
addopts = "-v --cov=solstein --cov-report=term-missing"
markers = [
    "unit: fast isolated tests",
    "integration: tests involving API/service integration",
    "data_quality: regression tests against curated datasets",
    "agents: tests for agent orchestration behavior",
    "slow: long-running tests",
    "e2e: end-to-end tests",
]

# EPIC-028 Story 5: Parallel execution and optimization
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
timeout = 300  # 5 minutes per test
xfail_strict = true
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "basedpyright>=1.38.4",
    "factory-boy>=3.3.3",
    "griffe>=2.0.1",
    "libcst>=1.8.6",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-randomly>=4.0.1",
    "pytest-xdist>=3.3.0",
    "syrupy>=5.1.0",
    "testcontainers>=4.14.1",
]

[tool.mutmut]
paths_to_mutate = ["src/solstein"]
runner = "pytest"
tests_dir = "tests"

# Cache configuration for query results
[tool.solstein.cache]
default_ttl = 300  # 5 minutes
max_size_mb = 100
