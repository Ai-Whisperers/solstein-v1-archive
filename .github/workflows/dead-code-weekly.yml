name: Dead Code Weekly Report

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  dead-code-report:
    name: Weekly Dead Code Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv

      - name: Run dead code detection (JSON metrics)
        run: |
          echo "## Weekly Dead Code Metrics Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run date**: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary Metrics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python scripts/ci/detect_dead_code.py src/solstein --json | \
            python3 -c "import json,sys; d=json.load(sys.stdin); \
              print('Dead code items:', d['dead_code_count']); \
              print('Helper utilization:', round(d['avg_utilization'], 1), '%'); \
              sc=d['structural_checks']; \
              print('Refresh router absent:', not sc['refresh_router_exists']); \
              print('worker_tasks_v2 absent:', not sc['worker_tasks_v2_exists'])" \
            >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Could not parse JSON output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run dead code detection (full report)
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python scripts/ci/detect_dead_code.py src/solstein >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Threshold check (warn if count exceeds limit)
        run: |
          COUNT=$(python scripts/ci/detect_dead_code.py src/solstein --json | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['dead_code_count'])" 2>/dev/null || echo "0")
          echo "Dead code count: $COUNT"
          if [ "$COUNT" -gt 50 ]; then
            echo "::warning::$COUNT potentially dead code items detected (threshold: 50). Review and clean up."
          else
            echo "Dead code count ($COUNT) is within threshold (50)."
          fi
