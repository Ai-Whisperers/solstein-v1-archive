name: SBOM Generation

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py -i . -o bom.xml --format xml --exclude .venv:exclude node_modules:exclude dashboard:exclude
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.xml
          retention-days: 365
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: bom.xml
          asset_name: solstein-${{ github.event.release.tag_name }}-sbom.xml
          asset_content_type: application/xml
