name: Validate Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install action-validator
        run: |
          npm install -g @action-validator/core @action-validator/cli

      - name: Validate workflow files
        run: |
          for file in .github/workflows/*.yml; do
            echo "Validating $file..."
            action-validator "$file"
          done

      - name: Check for common issues
        run: |
          # Check for 'latest' or 'master' in action refs
          if grep -r "uses:.*@master\|uses:.*@latest" .github/workflows/*.yml | grep -v "#"; then
            echo "❌ Found unpinned action references (master/latest)"
            exit 1
          fi
          echo "✅ All actions are pinned"

      - name: Run actionlint
        uses: ruzickap/actionlint@v1
        with:
          flags: -ignore "SC"
