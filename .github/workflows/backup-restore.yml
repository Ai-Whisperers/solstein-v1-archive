name: Backup and Restore

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - backup
          - restore
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production
      backup_file:
        description: 'Backup file to restore (for restore action)'
        required: false
        type: string

concurrency:
  group: backup-restore-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.inputs.action != 'restore'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get database credentials
        run: |
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier solstein-${{ github.event.inputs.environment || 'production' }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          
          echo "DATABASE_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Create backup
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="solstein-${{ github.event.inputs.environment || 'production' }}-$TIMESTAMP.sql.gz"
          
          PGPASSWORD=${{ secrets.DB_PASSWORD }} pg_dump \
            -h ${{ env.DATABASE_HOST }} \
            -U postgres \
            -d solstein \
            --verbose \
            | gzip > $BACKUP_FILE
          
          # Upload to S3
          aws s3 cp $BACKUP_FILE s3://solstein-backups-${{ github.event.inputs.environment || 'production' }}/$BACKUP_FILE
          
          # Clean up local file
          rm $BACKUP_FILE
          
          echo "✅ Backup completed: $BACKUP_FILE"

      - name: Clean old backups
        run: |
          # Keep only last 30 days of backups
          aws s3 ls s3://solstein-backups-${{ github.event.inputs.environment || 'production' }}/ | \
            awk '{print $4}' | \
            while read file; do
              aws s3 rm s3://solstein-backups-${{ github.event.inputs.environment || 'production' }}/$file
            done

  restore:
    name: Database Restore
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event.inputs.action == 'restore'
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Confirm restore
        run: |
          echo "⚠️ WARNING: This will restore the database from backup!"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Backup file: ${{ github.event.inputs.backup_file }}"
          
          # Add a manual approval step in production
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "❌ Production restore requires manual approval"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get database credentials
        run: |
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier solstein-${{ github.event.inputs.environment }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          
          echo "DATABASE_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Download and restore backup
        run: |
          BACKUP_FILE="${{ github.event.inputs.backup_file }}"
          
          # Download from S3
          aws s3 cp s3://solstein-backups-${{ github.event.inputs.environment }}/$BACKUP_FILE $BACKUP_FILE
          
          # Restore database
          gunzip -c $BACKUP_FILE | \
            PGPASSWORD=${{ secrets.DB_PASSWORD }} psql \
              -h ${{ env.DATABASE_HOST }} \
              -U postgres \
              -d solstein
          
          # Clean up
          rm $BACKUP_FILE
          
          echo "✅ Restore completed from: $BACKUP_FILE"

      - name: Verify restore
        run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql \
            -h ${{ env.DATABASE_HOST }} \
            -U postgres \
            -d solstein \
            -c "SELECT COUNT(*) FROM companies;"
