name: Release Pipeline

on:
  push:
    tags:
      - 'release-*'
      - 'test-*'
      - 'coverage-*'
      - 'security-*'
  workflow_dispatch:

jobs:
  parse-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_type: ${{ steps.version.outputs.tag_type }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract version from tag
      id: version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        
        if [[ $TAG_NAME == release-* ]]; then
          VERSION=${TAG_NAME#release-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_type=release" >> $GITHUB_OUTPUT
        elif [[ $TAG_NAME == test-* ]]; then
          VERSION=${TAG_NAME#test-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_type=test" >> $GITHUB_OUTPUT
        elif [[ $TAG_NAME == coverage-* ]]; then
          VERSION=${TAG_NAME#coverage-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_type=coverage" >> $GITHUB_OUTPUT
        elif [[ $TAG_NAME == security-* ]]; then
          VERSION=${TAG_NAME#security-}
          echo "version=0.0.1-security-$VERSION" >> $GITHUB_OUTPUT
          echo "tag_type=security" >> $GITHUB_OUTPUT
        fi
        
        echo "Parsed: ${{ steps.version.outputs.tag_type }} - ${{ steps.version.outputs.version }}"

  test-release:
    needs: parse-version
    runs-on: ubuntu-latest
    if: needs.parse-version.outputs.tag_type != 'coverage'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run full test suite
      run: |
        pytest tests/ -v --cov=solstein --cov-report=xml

  build-release:
    needs: [parse-version, test-release]
    runs-on: ubuntu-latest
    if: needs.parse-version.outputs.tag_type == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release:
    needs: [parse-version, test-release]
    runs-on: ubuntu-latest
    if: needs.parse-version.outputs.tag_type == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ needs.parse-version.outputs.version }}
        draft: false
        prerelease: false
