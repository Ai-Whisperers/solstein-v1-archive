name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Dependency scanning
      - name: Install dependencies
        run: |
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --format=json --output=audit-report.json || true

      # Static analysis
      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      # Secrets scanning
      - name: Secret Detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

      # Custom security audit
      - name: Run Security Audit
        run: |
          pip install -e .
          python scripts/security_audit.py --full --report security-report.json

      # Security Gate
      - name: Security Gate
        run: |
          echo "Checking for critical/high vulnerabilities..."

          # Check pip-audit results
          if [ -f audit-report.json ]; then
            CRITICAL=$(jq '[.dependencies[]?.vulns[]? | select(.severity == "CRITICAL")] | length' audit-report.json || echo "0")
            HIGH=$(jq '[.dependencies[]?.vulns[]? | select(.severity == "HIGH")] | length' audit-report.json || echo "0")

            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "❌ Found $CRITICAL critical and $HIGH high severity vulnerabilities"
              exit 1
            fi
          fi

          # Check bandit results
          if [ -f bandit-report.json ]; then
            HIGH_SEVERITY=$(jq '[.results[]? | select(.issue_severity == "HIGH")] | length' bandit-report.json || echo "0")

            if [ "$HIGH_SEVERITY" -gt 0 ]; then
              echo "❌ Found $HIGH_SEVERITY high severity code issues"
              exit 1
            fi
          fi

          # Check custom audit
          if [ -f security-report.json ]; then
            CRITICAL=$(jq '.summary.CRITICAL // 0' security-report.json)

            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Found $CRITICAL critical security issues"
              exit 1
            fi
          fi

          echo "✅ Security scan passed"

      # Upload reports
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            audit-report.json
            bandit-report.json
            security-report.json
