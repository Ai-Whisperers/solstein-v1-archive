name: Integration Tests

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/integration/**'
      - 'pyproject.toml'
      - '.github/workflows/integration-tests.yml'

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: src

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solstein_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - uses: ./.github/workflows/composite/install-deps
        with:
          extras: dev
          additional-packages: factory-boy testcontainers

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solstein_integration
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/solstein_integration
          REDIS_URL: redis://localhost:6379/0
          REDIS__URL: redis://localhost:6379/0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECURITY__SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
          COMPANIES_HOUSE_API_KEY: test-key

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = context.payload.repository.html_url + '/actions/runs/' + context.runId;
            const issueTitle = '[AUTOMATED] Integration Tests Failed';
            const issueBody = 'Integration tests failed on ' + new Date().toISOString() + '\n\n[View Run](' + runUrl + ')';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'integration-tests,automated'
            });

            const existingIssue = issues.data.find(issue => issue.title === issueTitle);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['integration-tests', 'automated']
              });
            }
