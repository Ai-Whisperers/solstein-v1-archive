name: 'Setup Python Environment'
description: 'Setup Python with pip caching'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt
