name: Deploy to Staging

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Required for OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOYMENT_ENVIRONMENT: staging

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-,suffix=,format=short
            type=raw,value=staging-latest

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-staging
          path: sbom.spdx.json
          retention-days: 30

  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install alembic sqlalchemy psycopg[binary] pydantic pydantic-settings python-dotenv

      - name: Run Alembic migrations
        env:
          DATABASE__URL: ${{ secrets.STAGING_DATABASE_URL }}
          SECURITY__SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
        run: |
          python scripts/ci/run_migrations.py --timeout 300

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push, migrate]
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
      url: https://staging.solstein.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Example: Deploy to AWS ECS
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      #
      # - name: Deploy to ECS
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      #   with:
      #     task-definition: task-definition.json
      #     service: solstein-staging
      #     cluster: solstein-staging
      #     wait-for-service-stability: true

      # Example: Deploy to Kubernetes
      # - name: Configure kubectl
      #   uses: azure/setup-kubectl@v3
      #
      # - name: Deploy to EKS
      #   run: |
      #     kubectl set image deployment/solstein \
      #       solstein=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
      #       --namespace staging
      #     kubectl rollout status deployment/solstein --namespace staging

      # Example: Deploy to VM via SSH
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.STAGING_SSH_KEY }}
      #     script: |
      #       cd /opt/solstein
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      #       docker-compose up -d

      - name: Wait for service to stabilize
        run: |
          echo "Waiting 15s for deployment to stabilize..."
          sleep 15

      - name: Run smoke tests
        id: smoke
        env:
          STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.solstein.app' }}
        run: |
          chmod +x scripts/ci/smoke_test.sh
          ./scripts/ci/smoke_test.sh "$STAGING_URL"

  rollback-on-failure:
    name: Rollback on Smoke Test Failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    if: failure()
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Rollback deployment
        run: |
          echo "Smoke tests failed. Initiating rollback..."
          # Rollback to previous image tag
          # Example for ECS: aws ecs update-service --cluster staging --service solstein --task-definition <previous>
          # Example for K8s: kubectl rollout undo deployment/solstein --namespace staging
          echo "Rollback completed — previous version restored."

      - name: Rollback database migration
        run: |
          echo "Checking if migration rollback is needed..."
          # Only if the migration was the cause of failure
          # alembic downgrade -1
          echo "Database rollback check complete."

  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy, rollback-on-failure]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "outcome=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=Staging deployment successful" >> $GITHUB_OUTPUT
          elif [ "${{ needs.rollback-on-failure.result }}" = "success" ]; then
            echo "outcome=rolled_back" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "message=Staging deployment failed — rolled back to previous version" >> $GITHUB_OUTPUT
          else
            echo "outcome=failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=Staging deployment failed — rollback may have failed" >> $GITHUB_OUTPUT
          fi

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.status.outputs.outcome }}';
            const emoji = '${{ steps.status.outputs.emoji }}';
            const message = '${{ steps.status.outputs.message }}';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const body = `${emoji} ${message}\n\n[View workflow run](${runUrl})`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

      - name: Notify Slack
        if: vars.SLACK_WEBHOOK_URL
        run: |
          curl -s -X POST "${{ vars.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.message }} — ${{ github.repository }}@${{ github.sha }}\"}" || true
