name: Load Testing

on:
  schedule:
    # Run every Sunday at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration in minutes'
        required: false
        default: '10'
        type: string
      users:
        description: 'Number of concurrent users'
        required: false
        default: '100'
        type: string
      spawn_rate:
        description: 'User spawn rate per second'
        required: false
        default: '10'
        type: string
      host:
        description: 'Target host'
        required: false
        default: 'https://staging.solstein.app'
        type: string

concurrency:
  group: load-testing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load-test:
    name: Run Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/workflows/composite/setup-python

      - name: Install Locust
        run: pip install locust

      - name: Run load tests
        run: |
          locust -f tests/load/locustfile.py \
            --headless \
            -u ${{ github.event.inputs.users || '100' }} \
            -r ${{ github.event.inputs.spawn_rate || '10' }} \
            --run-time ${{ github.event.inputs.duration || '10' }}m \
            --host ${{ github.event.inputs.host || 'https://staging.solstein.app' }} \
            --html=load-test-report.html \
            --json=load-test-results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-test-report.html
            load-test-results.json
          retention-days: 30

      - name: Check thresholds
        run: |
          # Parse results and check if p95 response time is under threshold
          P95=$(cat load-test-results.json | jq -r '.stats[0].percentiles["0.95"]')
          THRESHOLD=2000  # 2 seconds
          
          if (( $(echo "$P95 > $THRESHOLD" | bc -l) )); then
            echo "❌ P95 response time ($P95 ms) exceeds threshold ($THRESHOLD ms)"
            exit 1
          fi
          
          echo "✅ P95 response time ($P95 ms) within threshold"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔥 Load Test Failed',
              body: `Load test failed on ${new Date().toISOString()}.
              
Performance thresholds exceeded.

[View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['performance', 'load-testing', 'incident']
            });
