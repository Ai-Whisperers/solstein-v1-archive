name: Code Quality Guardrails

on:
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - '.github/workflows/code-quality-guardrails.yml'
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - '.github/workflows/code-quality-guardrails.yml'

env:
  PYTHON_VERSION: "3.12"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv

      - name: Install radon
        run: uv pip install --system radon

      - name: Check code smells
        id: code-smells
        run: python scripts/ci/code_smell_detector.py
        continue-on-error: true

      - name: Check function sizes
        id: function-sizes
        run: python scripts/ci/check_function_sizes.py --max-lines 100 --fail-on-violation

      - name: Check class sizes
        id: class-sizes
        run: python scripts/ci/check_class_sizes.py --max-lines 300 --fail-on-violation

      - name: Check file sizes
        id: file-sizes
        run: python scripts/ci/check_file_sizes.py --max-lines 500

      - name: Check for bare excepts
        id: bare-excepts
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.py$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' || true)
          fi

          if [ -n "$CHANGED_FILES" ]; then
            echo "Checking changed files: $CHANGED_FILES"
            python scripts/ci/code_smell_detector.py $CHANGED_FILES
          else
            echo "No Python files changed"
          fi

      - name: Generate complexity metrics
        run: |
          echo "## Complexity Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cyclomatic Complexity" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon cc src --average >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon mi src >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment on code smell failures
        if: steps.code-smells.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Code Smell Detection Failed**\n\nPlease review the code smell report and address any critical issues.'
            })

      - name: Fail if any check failed
        if: steps.function-sizes.outcome == 'failure' || steps.class-sizes.outcome == 'failure' || steps.file-sizes.outcome == 'failure'
        run: |
          echo "❌ One or more code quality checks failed"
          exit 1
