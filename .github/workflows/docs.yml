name: "📜 Deploy Docs to GitHub Pages"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build the Grimoire
    runs-on: ubuntu-latest

    steps:
      - name: 🧙 Checkout the scrolls
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚗️ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: 📚 Install MkDocs + Material
        run: pip install "mkdocs<2.0" mkdocs-material mkdocs-awesome-pages-plugin

      - name: 🔮 Build the site
        run: mkdocs build --verbose

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🚀 Cast the spell — deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
