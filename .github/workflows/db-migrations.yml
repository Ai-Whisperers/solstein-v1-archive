name: Database Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'alembic/**'
      - 'src/solstein/infrastructure/database_models.py'
      - '.github/workflows/db-migrations.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations on'
        required: true
        type: choice
        options:
          - staging
          - production
      command:
        description: 'Alembic command'
        required: true
        type: choice
        options:
          - upgrade
          - downgrade
          - current
          - history
      revision:
        description: 'Revision (for upgrade/downgrade)'
        required: false
        type: string
        default: 'head'

concurrency:
  group: db-migrations-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - uses: ./.github/workflows/composite/install-deps

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get database credentials
        run: |
          # Get RDS endpoint from AWS
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier solstein-${{ github.event.inputs.environment || 'staging' }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          
          echo "DATABASE_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Run migration
        env:
          DATABASE__URL: postgresql://postgres:${{ secrets.DB_PASSWORD }}@${{ env.DATABASE_HOST }}:5432/solstein
        run: |
          cd alembic
          if [ "${{ github.event.inputs.command || 'upgrade' }}" == "upgrade" ]; then
            alembic upgrade ${{ github.event.inputs.revision || 'head' }}
          elif [ "${{ github.event.inputs.command }}" == "downgrade" ]; then
            alembic downgrade ${{ github.event.inputs.revision }}
          elif [ "${{ github.event.inputs.command }}" == "current" ]; then
            alembic current
          elif [ "${{ github.event.inputs.command }}" == "history" ]; then
            alembic history
          fi

      - name: Verify migration
        if: github.event.inputs.command == 'upgrade' || github.event.inputs.command == null
        env:
          DATABASE__URL: postgresql://postgres:${{ secrets.DB_PASSWORD }}@${{ env.DATABASE_HOST }}:5432/solstein
        run: |
          cd alembic
          alembic current

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Database Migration Failed',
              body: `Migration failed on ${context.payload.inputs?.environment || 'staging'}.
              
Command: ${context.payload.inputs?.command || 'upgrade'}

[View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['database', 'migration', 'incident']
            });
