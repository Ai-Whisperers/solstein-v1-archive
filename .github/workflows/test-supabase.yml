name: Database Tests (Supabase)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv sync
      
      - name: Run database tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          uv run pytest tests/unit/test_fact_repository.py \
                  tests/unit/test_database.py \
                  tests/unit/test_database_service.py \
                  tests/unit/test_enrichment_repositories.py \
                  -v --tb=short
      
      - name: Run type checking
        run: |
          uv run mypy src/solstein --ignore-missing-imports
      
      - name: Run linting
        run: |
          uv run ruff check src/solstein tests
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            pytest-report.xml
            .coverage
