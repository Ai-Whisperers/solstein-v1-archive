name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: src
  UV_SYSTEM_PYTHON: 1
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solstein_test
  DATABASE__URL: postgresql://postgres:postgres@localhost:5432/solstein_test
  REDIS_URL: redis://localhost:6379/0
  REDIS__URL: redis://localhost:6379/0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  security-events: write

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Run ruff check
        run: ruff check src/ tests/
      - name: Run ruff format check
        run: ruff format --check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - uses: ./.github/workflows/composite/install-deps
      - name: Run mypy
        run: mypy

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - name: Install security tools
        run: uv pip install --system bandit safety
      - name: Run bandit
        run: bandit -r src/ -f sarif -o bandit-report.sarif --severity-level medium
      - name: Upload bandit results
        uses: github/codeql-action/upload-sarif@v3
        if: failure()
        with:
          sarif_file: bandit-report.sarif
          category: bandit
      - name: Run safety check
        run: safety check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solstein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/composite/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/workflows/composite/setup-uv
      - name: Create .env for tests
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env
          echo "DATABASE__URL=${{ env.DATABASE__URL }}" >> .env
          echo "REDIS_URL=${{ env.REDIS_URL }}" >> .env
          echo "REDIS__URL=${{ env.REDIS__URL }}" >> .env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "SECURITY__SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> .env
          echo "ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}" >> .env
          echo "SECURITY__ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}" >> .env
          echo "ADMIN_PASSWORD_HASH=${{ secrets.TEST_ADMIN_PASSWORD_HASH }}" >> .env
          echo "SECURITY__ADMIN_PASSWORD_HASH=${{ secrets.TEST_ADMIN_PASSWORD_HASH }}" >> .env
      - uses: ./.github/workflows/composite/install-deps
        with:
          extras: dev
          additional-packages: factory-boy pytest-randomly syrupy testcontainers
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=solstein --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, type-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.23.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy
