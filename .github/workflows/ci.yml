name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  determine-threshold:
    runs-on: ubuntu-latest
    outputs:
      threshold: ${{ steps.threshold.outputs.threshold }}
      branch_type: ${{ steps.threshold.outputs.branch_type }}
    steps:
    - name: Determine coverage threshold
      id: threshold
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        
        case $BRANCH_NAME in
          main|master)
            echo "threshold=80" >> $GITHUB_OUTPUT
            echo "branch_type=production" >> $GITHUB_OUTPUT
            ;;
          develop)
            echo "threshold=75" >> $GITHUB_OUTPUT
            echo "branch_type=integration" >> $GITHUB_OUTPUT
            ;;
          hotfix/*)
            echo "threshold=75" >> $GITHUB_OUTPUT
            echo "branch_type=hotfix" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "threshold=70" >> $GITHUB_OUTPUT
            echo "branch_type=feature" >> $GITHUB_OUTPUT
            ;;
        esac
        echo "Branch: $BRANCH_NAME, Threshold: ${{ steps.threshold.outputs.threshold }}"

  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - uses: dawidd6/action-get-latest-tag@v1
      if: github.event_name == 'push'
      with:
        registry: github
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with ruff
      run: |
        ruff check src/
        ruff format --check src/
    
    - name: Type check with mypy
      run: |
        mypy src/
    
    - name: Run safety check
      run: |
        safety check --ignore=45158 || true
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=solstein --cov-report=xml --cov-report=term-missing
    
    - name: Enforce coverage thresholds
      run: |
        python3 scripts/enforce_coverage.py || true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
        
    - name: Install dependencies
      working-directory: ./dashboard
      run: npm ci --legacy-peer-deps
      
    - name: Lint Dashboard
      working-directory: ./dashboard
      run: npm run lint
      
    - name: Test Dashboard
      working-directory: ./dashboard
      run: npm run test

  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
        
    - name: Install Backend
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install Frontend
      working-directory: ./dashboard
      run: npm ci --legacy-peer-deps
      
    - name: Install Playwright Browsers
      working-directory: ./dashboard
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      working-directory: ./dashboard
      run: npx playwright test
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: dashboard/playwright-report/
        retention-days: 30

  docker:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
