name: CI

on:
  push:
    branches: [develop, main, master]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'scripts/ci/**']
  pull_request:
    branches: [develop, main, master]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'scripts/ci/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: src
  UV_SYSTEM_PYTHON: 1

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - run: uv pip install --system ruff
      - name: Ruff check
        run: ruff check src/ tests/ scripts/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - uses: ./.github/workflows/composite/install-deps
      - name: Mypy
        run: mypy src/solstein --ignore-missing-imports --no-error-summary || true
        # NOTE: mypy is advisory until type coverage improves

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solstein_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solstein_test
      DATABASE__URL: postgresql://postgres:postgres@localhost:5432/solstein_test
      REDIS_URL: redis://localhost:6379/0
      SECURITY__SECRET_KEY: test-secret-key-minimum-32-characters-long
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ADMIN_EMAIL: test@solstein.dev
      SECURITY__ADMIN_EMAIL: test@solstein.dev
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - uses: ./.github/workflows/composite/install-deps
        with:
          extras: dev
          additional-packages: factory-boy pytest-randomly
      - name: Run tests
        run: |
          pytest tests/unit/ -v \
            --cov=solstein \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=25 \
            --tb=short \
            -x
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/workflows/composite/setup-python
      - uses: ./.github/workflows/composite/setup-uv
      - name: Install security tools
        run: uv pip install --system bandit
      - name: Bandit
        run: bandit -r src/ -f json -o bandit-report.json --severity-level medium || true
      - name: Security summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            python3 -c "import json; r=json.load(open('bandit-report.json')); print(f'Issues found: {len(r.get(\"results\",[]))}')" >> $GITHUB_STEP_SUMMARY
          fi
