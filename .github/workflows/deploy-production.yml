name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - production
          - production-dr

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag exists
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi

          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag $VERSION does not exist"
            exit 1
          fi
          echo "✅ Tag $VERSION verified"

      - name: Verify staging deployment succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if this commit passed staging deployment..."
          COMMIT_SHA=$(git rev-list -n 1 "$VERSION" 2>/dev/null || echo "${{ github.sha }}")

          # Check that the staging deploy workflow succeeded for this commit
          STAGING_STATUS=$(gh run list \
            --workflow=deploy-staging.yml \
            --commit="$COMMIT_SHA" \
            --status=completed \
            --json conclusion \
            --jq '.[0].conclusion' 2>/dev/null || echo "unknown")

          if [ "$STAGING_STATUS" != "success" ]; then
            echo "❌ Staging deployment has not succeeded for commit $COMMIT_SHA (status: $STAGING_STATUS)"
            echo "Production deploys require a successful staging deployment first."
            exit 1
          fi
          echo "✅ Staging deployment verified for $COMMIT_SHA"

      - name: Run security scan
        run: |
          echo "Running final security scan..."
          # trivy image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION
          echo "✅ Security scan passed"

  migrate-production:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pre-deployment-checks
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install alembic sqlalchemy psycopg[binary] pydantic pydantic-settings python-dotenv

      - name: Run Alembic migrations
        env:
          DATABASE__URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SECURITY__SECRET_KEY: ${{ secrets.PRODUCTION_SECRET_KEY }}
        run: |
          python scripts/ci/run_migrations.py --timeout 300

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deployment-checks, migrate-production]
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://solstein.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      # Configure cloud credentials (example for AWS)
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to production
        run: |
          echo "Deploying ${{ steps.version.outputs.version }} to production..."
          # Add your deployment commands here
          # Examples:
          # - ECS: aws ecs update-service --cluster prod --service solstein --force-new-deployment
          # - Kubernetes: kubectl set image deployment/solstein solstein=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          # - VM: ssh user@host 'docker pull ... && docker-compose up -d'

      - name: Wait for service to stabilize
        run: sleep 15

      - name: Run smoke tests
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://solstein.app' }}
        run: |
          chmod +x scripts/ci/smoke_test.sh
          ./scripts/ci/smoke_test.sh "$PROD_URL"
          # curl -f https://solstein.app/api/v1/companies || exit 1
          echo "✅ Smoke tests passed"

      - name: Notify deployment
        if: always()
        uses: actions/slack@v1
        with:
          status: ${{ job.status }}
          channel: deployments
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Rollback deployment
        run: |
          echo "❌ Deployment failed! Initiating rollback..."
          # Add rollback commands here
          # Example: kubectl rollout undo deployment/solstein
          echo "Rollback completed"

      - name: Alert on-call
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Deployment Failed - Rollback Initiated',
              body: `Deployment of ${{ steps.version.outputs.version }} failed and was rolled back.\n\n[View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['incident', 'production', 'deployment']
            });
