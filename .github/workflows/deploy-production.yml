name: Deploy Production

# STORY-099: Production deployment gates on successful staging deployment.
# Triggered manually after staging has been verified.

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: 'Completed deploy-staging run ID to verify before promoting'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Verify Staging Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check staging workflow conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # STORY-099: Block production deploy if staging didn't succeed
          STAGING_STATUS=$(gh run view "${{ github.event.inputs.staging_run_id }}" \
            --repo "${{ github.repository }}" \
            --json conclusion \
            --jq '.conclusion')
          echo "Staging conclusion: $STAGING_STATUS"
          if [ "$STAGING_STATUS" != "success" ]; then
            echo "ERROR: Staging run did not succeed (got: $STAGING_STATUS). Blocking production deploy."
            exit 1
          fi

  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test against staging
        run: |
          # STORY-099: Verify staging is healthy before promoting to production
          bash scripts/ci/smoke_test.sh staging
          # Allow service to stabilize before proceeding
          sleep 5

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, smoke-test]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying to production after staging verified via deploy-staging workflow"
          # Production deploy commands go here
