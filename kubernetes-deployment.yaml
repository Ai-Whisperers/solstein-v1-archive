apiVersion: v1
kind: Namespace
metadata:
  name: solstein

---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: solstein
  name: solstein-config
data:
  DATABASE_PATH: "/var/lib/solstein/data"
  SOLSTEIN_ML_MODELS_ENABLED: "true"
  SOLSTEIN_WEBHOOKS_ENABLED: "true"

---
apiVersion: v1
kind: Secret
metadata:
  namespace: solstein
  name: solstein-secrets
type: Opaque
stringData:
  SOLSTEIN_SECRET_KEY: "changeme-in-production"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: solstein
  name: solstein-api
spec:
  serviceName: solstein-api
  replicas: 3
  selector:
    matchLabels:
      app: solstein-api
      tier: backend
  template:
    metadata:
      labels:
        app: solstein-api
        tier: backend
    spec:
      containers:
      - name: api
        image: solstein:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: SOLSTEIN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: solstein-secrets
              key: SOLSTEIN_SECRET_KEY
        - name: DATABASE_PATH
          valueFrom:
            configMapKeyRef:
              name: solstein-config
              key: DATABASE_PATH
        envFrom:
        - configMapRef:
            name: solstein-config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: data
          mountPath: /var/lib/solstein/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: solstein-pvc
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  namespace: solstein
  name: solstein-api
spec:
  selector:
    app: solstein-api
    tier: backend
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: solstein
  name: solstein-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: solstein
  name: solstein-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: solstein-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: solstein
  name: solstein-api-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: solstein-api
      tier: backend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: solstein
  name: solstein-network-policy
spec:
  podSelector:
    matchLabels:
      app: solstein-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
