apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solstein

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - security.yaml

commonLabels:
  app.kubernetes.io/name: solstein
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/your-org/solstein
    newTag: latest

replicas:
  - name: solstein-api
    count: 3
