repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [ pydantic, types-requests ]

  - repo: local
    hooks:
      - id: docs-lint
        name: Lint Documentation
        entry: bash scripts/lint-docs.sh
        language: script
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [ commit ]

      - id: docs-link-validation
        name: Validate Documentation Links
        entry: python3 scripts/validate-links.py --no-external
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [ commit ]

      - id: docs-examples-validation
        name: Validate Code Examples in Docs
        entry: python3 scripts/validate-examples.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [ commit ]
