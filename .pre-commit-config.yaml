repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  # EPIC-019: Agent Code Quality Pre-commit Hook
  - repo: local
    hooks:
      - id: agent-code-quality
        name: Agent Code Quality Checks
        entry: python3 scripts/ci/agent_precommit_hook.py
        language: system
        files: \.(py)$
        pass_filenames: true
        stages: [pre-commit]
      - id: code-smell-detector
        name: Code Smell Detection
        entry: python3 scripts/ci/code_smell_detector.py
        language: system
        files: \.(py)$
        pass_filenames: true
        stages: [pre-commit]