repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [ pydantic, types-requests ]

  - repo: https://github.com/Lucas-C/pre-commit-hooks-bandit
    rev: v1.0.5
    hooks:
      - id: python-bandit
        args: ['-ll', '--exclude=.pytest_cache,build,dist']

  - repo: https://github.com/pyupio/safety
    rev: 3.2.0
    hooks:
      - id: safety
        args: ['check', '--ignore=45158']

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ['--convention=google', '--add-ignore=D100,D104,D105,D107']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['--config-file=.yamllint']

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.25.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        args: ['--changelog', '--check-commit']

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.77.0
    hooks:
      - id: trufflehog
        args: ['--exclude={.git-hooks,fixtures,__pycache__}']
        stages: [push]

  - repo: https://github.com/rubik/radon-ct-pre-commit
    rev: v1.0.1
    hooks:
      - id: radon-ct
        args: ['--exit-zero-even-if-changes', '--cc-min=10', '--exclude=tests/']

  - repo: https://github.com/igorshubovych/markdownlint
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ['--disable=MD013', '--ignore=.sisyphus/', '--ignore=dashboard/']

  - repo: local
    hooks:
      - id: docs-lint
        name: Lint Documentation
        entry: bash scripts/lint-docs.sh
        language: script
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [ commit ]

      - id: docs-link-validation
        name: Validate Documentation Links
        entry: python3 scripts/validate-links.py --no-external
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [ commit ]

      - id: docs-examples-validation
        name: Validate Code Examples in Docs
        entry: python3 scripts/validate-examples.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [ commit ]
