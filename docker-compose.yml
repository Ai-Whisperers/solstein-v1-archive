version: '3.8'

services:
  api:
    build: .
    container_name: solstein-api
    ports:
      - "8000:8000"
    environment:
      SOLSTEIN_SECRET_KEY: "${SOLSTEIN_SECRET_KEY:-solstein-dev-key}"
      DATABASE_PATH: /app/data
    volumes:
      - solstein_data:/app/data
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  orchestrator:
    build: .
    container_name: solstein-orchestrator
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_PATH: /app/data
    volumes:
      - solstein_data:/app/data
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    command: python3 integration-orchestrator.py
    profiles:
      - background

  analytics:
    build: .
    container_name: solstein-analytics
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_PATH: /app/data
    volumes:
      - solstein_data:/app/data
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    command: python3 ml-models-engine.py
    profiles:
      - background

  dashboard:
    build: .
    container_name: solstein-dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8000"
    environment:
      DATABASE_PATH: /app/data
    volumes:
      - solstein_data:/app/data
      - ./scripts:/app/scripts:ro
      - ./dashboards:/app/dashboards
    restart: unless-stopped
    command: python3 dashboard-generator.py
    profiles:
      - background

volumes:
  solstein_data:
    driver: local
